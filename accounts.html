<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAZEL</title>


    <!-- Google Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <!-- =========================
         TOP HEADER
    ========================= -->

    <header class="header">


        <!-- PROFILE -->

        <div class="profile">


            <!-- GOLDEN SHIELD -->

            <div class="shield">

                <div class="pfp-wrapper">

                    <img
                        src="photos/InShot_20260504_225145550.jpg"
                        alt="HAZEL"
                        class="pfp">

                </div>

            </div>


            <!-- NAME -->

            <div class="profile-info">

                <div class="name">
                    HAZEL
                </div>

                <div class="since">
                    Since 18 June 2025
                </div>

            </div>

        </div>



        <!-- THREE DOTS -->

        <button
            class="menu-button"
            id="menuButton"
            aria-label="Open menu">

            <i class="fa-solid fa-ellipsis-vertical"></i>

        </button>


    </header>



    <!-- =========================
         DROPDOWN MENU
    ========================= -->

    <div
        class="menu"
        id="menu">


        <!-- SEARCH -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search options..."
                autocomplete="off">

        </div>



        <!-- =========================
             BIRTHDAY
        ========================= -->

        <button
            class="menu-option"
            data-search="gudiya birthday 2026 birthday gudiya"
            data-link="birthday.html">

            <i class="fa-solid fa-cake-candles"></i>

            <span>
                Gudiya Birthday 2026
            </span>

        </button>



        <!-- =========================
             ANNIVERSARY
        ========================= -->

        <button
            class="menu-option"
            data-search="happy one year of us anniversary one year"
            data-link="anniversary.html">

            <i class="fa-solid fa-heart"></i>

            <span>
                Happy One Year of Us
            </span>

        </button>



        <!-- =========================
             ALWAYS TRUST IN ALLAH
        ========================= -->

        <button
            class="menu-option"
            data-search="always trust in allah trust allah unsaid"
            data-link="unsaid.html">

            <i class="fa-solid fa-hands-praying"></i>

            <span>
                Always Trust In Allah 🤍
            </span>

        </button>



        <!-- =========================
             DAILY TRACKING
        ========================= -->

        <button
            class="menu-option"
            data-search="daily tracking tracking daily goals tracker"
            data-link="tracking.html">

            <i class="fa-solid fa-chart-line"></i>

            <span>
                Daily Tracking
            </span>

        </button>



        <!-- =========================
             MEMORIES
        ========================= -->

        <button
            class="menu-option"
            data-search="memories memory private memories"
            data-link="memorieslogin.html">

            <i class="fa-solid fa-dove"></i>

            <span>
                Memories 🕊️
            </span>

        </button>



        <!-- =========================
             NO RESULT
        ========================= -->

        <div
            class="no-result"
            id="noResult">

            No matching option found.

        </div>


    </div>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">


        <!-- LIVE COUNTER -->

        <div class="counter">


            <div class="counter-title">
                TIME SINCE
            </div>


            <div class="counter-line"></div>


            <div class="counter-values">


                <!-- YEARS -->

                <div class="time-unit">

                    <span
                        id="years"
                        class="number">
                        0
                    </span>

                    <span class="label">
                        YEARS
                    </span>

                </div>


                <div class="separator">
                    :
                </div>


                <!-- MONTHS -->

                <div class="time-unit">

                    <span
                        id="months"
                        class="number">
                        0
                    </span>

                    <span class="label">
                        MONTHS
                    </span>

                </div>


                <div class="separator">
                    :
                </div>


                <!-- DAYS -->

                <div class="time-unit">

                    <span
                        id="days"
                        class="number">
                        0
                    </span>

                    <span class="label">
                        DAYS
                    </span>

                </div>


                <div class="separator">
                    :
                </div>


                <!-- HOURS -->

                <div class="time-unit">

                    <span
                        id="hours"
                        class="number">
                        0
                    </span>

                    <span class="label">
                        HOURS
                    </span>

                </div>


                <div class="separator">
                    :
                </div>


                <!-- MINUTES -->

                <div class="time-unit">

                    <span
                        id="minutes"
                        class="number">
                        0
                    </span>

                    <span class="label">
                        MINUTES
                    </span>

                </div>


                <div class="separator">
                    :
                </div>


                <!-- SECONDS -->

                <div class="time-unit">

                    <span
                        id="seconds"
                        class="number">
                        0
                    </span>

                    <span class="label">
                        SECONDS
                    </span>

                </div>


            </div>


        </div>


    </main>



    <!-- =========================
         CUSTOM JAVASCRIPT
    ========================= -->

    <script
        src="script.js">
    </script>


</body>

    </html>
