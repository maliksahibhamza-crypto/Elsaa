<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friends | Elsa & Me</title>

    <link rel="stylesheet" href="friends.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="friends-container">

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="friends-header">

        <button id="backBtn" class="icon-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <h2>Friends</h2>

        <button id="addFriendBtn" class="icon-btn">

            <i class="fa-solid fa-user-plus"></i>

        </button>

    </header>

    <!-- ========================= -->
    <!-- SEARCH SECTION -->
    <!-- ========================= -->

    <section class="friends-search">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchUser"
                placeholder="Search by username..."
                autocomplete="off"
            >

            <button id="searchBtn">

                Search

            </button>

        </div>

    </section>

    <!-- ========================= -->
    <!-- SEARCH RESULT -->
    <!-- ========================= -->

    <section
        id="searchResult"
        class="search-result hidden"
    >

        <img
            id="resultProfile"
            src="images/default-profile.png"
            alt="Profile"
        >

        <div class="result-info">

            <h3 id="resultName">

                User Name

            </h3>

            <p id="resultUsername">

                @username

            </p>

        </div>

        <button id="sendRequestBtn">

            <i class="fa-solid fa-user-plus"></i>

            Add

        </button>

    </section>
    <!-- ========================= -->
    <!-- PENDING REQUESTS -->
    <!-- ========================= -->

    <section class="request-section">

        <h3>Pending Requests</h3>

        <div id="pendingRequests">

            <!-- Friend Requests will load here -->

        </div>

    </section>


    <!-- ========================= -->
    <!-- FRIENDS LIST -->
    <!-- ========================= -->

    <section class="friends-list-section">

        <div class="section-title">

            <h3>Your Friends</h3>

            <span id="friendsCount">

                0

            </span>

        </div>

        <div id="friendsList">

            <!-- Friends will load here dynamically -->

        </div>

    </section>


    <!-- ========================= -->
    <!-- EMPTY STATE -->
    <!-- ========================= -->

    <section
        id="emptyFriends"
        class="empty-state"
    >

        <i class="fa-solid fa-user-group"></i>

        <h3>

            No Friends Yet

        </h3>

        <p>

            Search for users by username and send your first friend request.

        </p>

    </section>
    <!-- ========================= -->
    <!-- LOADING SCREEN -->
    <!-- ========================= -->

    <div id="loadingScreen" class="loading hidden">

        <div class="loader"></div>

        <p>Loading...</p>

    </div>


    <!-- ========================= -->
    <!-- BOTTOM NAVIGATION -->
    <!-- ========================= -->

    <nav class="bottom-nav">

        <button id="homeBtn">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </button>

        <button id="friendsNavBtn" class="active">

            <i class="fa-solid fa-user-group"></i>

            <span>Friends</span>

        </button>

        <button id="chatBtn">

            <i class="fa-solid fa-comments"></i>

            <span>Chats</span>

        </button>

        <button id="settingsBtn">

            <i class="fa-solid fa-gear"></i>

            <span>Settings</span>

        </button>

    </nav>

</div>

<script type="module" src="friends.js"></script>

</body>

    </html>
