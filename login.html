
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAZEL | Secure Login</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">

    <!-- Particles -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

</head>

<body>

    <!-- Loading / Animation Screen -->

    <div id="loading-screen">

        <div class="intro-animation">

            <!-- Golden Heart -->
            <div class="heart-reveal">

                <i class="fa-solid fa-heart"></i>

            </div>

            <!-- Golden Rose -->
            <div class="rose-reveal">

                <i class="fa-solid fa-spa"></i>

            </div>

            <!-- Floating Petals -->
            <div class="rose-petals">

                <span class="petal petal-one"></span>
                <span class="petal petal-two"></span>
                <span class="petal petal-three"></span>
                <span class="petal petal-four"></span>
                <span class="petal petal-five"></span>
                <span class="petal petal-six"></span>

            </div>

        </div>

        <!-- Intro Title -->
        <div class="intro-title">

            <h1>HAZEL</h1>

            <p>A Story Left to Allah</p>

        </div>

        <!-- Loading Text -->
        <div class="loading-message">

            <div class="loader"></div>

            <p>Preparing Your Private Space...</p>

        </div>

    </div>

    <!-- Background Particles -->

    <div id="particles-js"></div>

    <!-- Login Container -->

    <div class="login-container">

        <!-- Logo -->

        <div class="logo">

            <i class="fa-solid fa-heart"></i>

        </div>

        <!-- Heading -->

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Access your private account securely.
        </p>

        <!-- Login Form -->

        <form id="loginForm">

            <!-- Username -->

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="off"
                    required>

            </div>

            <!-- Email -->

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    autocomplete="off"
                    required>

            </div>

            <!-- Password -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

                <span id="togglePassword">

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>

            <!-- Forgot Password -->

            <p class="forgot-password">

                <a href="#" id="forgotPassword">
                    Forgot Password?
                </a>

            </p>

            <!-- Login Button -->

            <button type="submit" id="loginBtn">
                Login
            </button>

        </form>

        <!-- Sign Up -->

        <p class="signup-text">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </p>

        <!-- Footer -->

        <div class="login-footer">

            <p>
                Protected by HAZEL Private Security
            </p>

        </div>

    </div>

    <!-- JavaScript -->

    <script type="module" src="login.js"></script>

</body>

</html>
