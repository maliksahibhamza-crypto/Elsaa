<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAZEL — Secure Access</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050505;
            --card: rgba(16, 16, 16, 0.92);
            --gold: #d4af37;
            --gold-light: #f0d477;
            --text: #f5f5f5;
            --muted: #858585;
            --border: rgba(212, 175, 55, 0.24);
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(212, 175, 55, 0.09),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(212, 175, 55, 0.07),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);
            font-family: "Poppins", sans-serif;

            overflow: hidden;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .glow {
            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background: rgba(212, 175, 55, 0.045);

            filter: blur(80px);

            pointer-events: none;

            animation: floatingGlow 8s ease-in-out infinite;
        }

        .glow.one {
            top: -120px;
            left: -120px;
        }

        .glow.two {
            right: -120px;
            bottom: -120px;

            animation-delay: -4s;
        }

        @keyframes floatingGlow {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(25px, -20px);
            }
        }

        /* =========================
           MAIN
        ========================= */

        .wrapper {
            width: 100%;
            max-width: 430px;

            animation: pageEnter 0.9s ease forwards;
        }

        @keyframes pageEnter {

            from {
                opacity: 0;
                transform: translateY(35px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           CARD
        ========================= */

        .card {
            padding: 40px 30px 32px;

            border: 1px solid var(--border);
            border-radius: 24px;

            background: var(--card);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.025);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            text-align: center;
        }

        .logo h1 {
            font-family: "Playfair Display", serif;

            font-size: 46px;
            font-weight: 600;

            letter-spacing: 7px;

            color: var(--gold);

            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%, 100% {
                text-shadow:
                    0 0 18px rgba(212, 175, 55, 0.12);
            }

            50% {
                text-shadow:
                    0 0 35px rgba(212, 175, 55, 0.32);
            }
        }

        .subtitle {
            margin-top: 7px;
            margin-bottom: 32px;

            text-align: center;

            color: var(--muted);

            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* =========================
           INPUTS
        ========================= */

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            color: #c4c4c4;

            font-size: 12px;
            font-weight: 500;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;

            padding: 14px 14px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;

            outline: none;

            background: rgba(255, 255, 255, 0.035);

            color: #fff;

            font-family: "Poppins", sans-serif;
            font-size: 13px;

            transition:
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }

        .input-wrap input::placeholder {
            color: #5f5f5f;
        }

        .input-wrap input:focus {
            border-color: rgba(212, 175, 55, 0.65);

            background: rgba(212, 175, 55, 0.035);

            box-shadow:
                0 0 0 3px rgba(212, 175, 55, 0.065),
                0 0 20px rgba(212, 175, 55, 0.05);
        }

        /* =========================
           PASSWORD TOGGLE
        ========================= */

        .show-password {
            position: absolute;

            top: 50%;
            right: 13px;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #737373;

            font-family: "Poppins", sans-serif;
            font-size: 10px;

            cursor: pointer;

            transition: color 0.25s ease;
        }

        .show-password:hover {
            color: var(--gold);
        }

        /* =========================
           BUTTON
        ========================= */

        .login-btn {
            width: 100%;

            margin-top: 9px;

            padding: 14px;

            border: none;
            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #b8942d,
                    #d4af37,
                    #b8942d
                );

            color: #080808;

            font-family: "Poppins", sans-serif;
            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(212, 175, 55, 0.14);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            filter: brightness(1.08);

            box-shadow:
                0 12px 32px rgba(212, 175, 55, 0.23);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            min-height: 19px;

            margin-top: 15px;

            text-align: center;

            font-size: 10px;

            transition: 0.3s ease;
        }

        .status.error {
            color: #d77777;
        }

        .status.success {
            color: var(--gold-light);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 24px;

            text-align: center;

            color: #4f4f4f;

            font-size: 9px;
            letter-spacing: 1.2px;
        }

        .footer span {
            color: #737373;
        }

        /* =========================
           SUCCESS SCREEN
        ========================= */

        .success-screen {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.96);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;

            z-index: 100;
        }

        .success-screen.show {
            opacity: 1;
            visibility: visible;
        }

        .success-content {
            text-align: center;

            transform: scale(0.8);

            transition: transform 0.55s ease;
        }

        .success-screen.show .success-content {
            transform: scale(1);
        }

        .success-icon {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 18px;

            border: 1px solid var(--gold);
            border-radius: 50%;

            color: var(--gold);

            font-size: 26px;

            box-shadow:
                0 0 35px rgba(212, 175, 55, 0.2);

            animation: successPulse 1.5s ease-in-out infinite;
        }

        @keyframes successPulse {

            0%, 100% {
                box-shadow:
                    0 0 20px rgba(212, 175, 55, 0.15);
            }

            50% {
                box-shadow:
                    0 0 40px rgba(212, 175, 55, 0.32);
            }
        }

        .success-content h2 {
            font-family: "Playfair Display", serif;

            color: var(--gold);

            font-size: 25px;
            font-weight: 500;
        }

        .success-content p {
            margin-top: 7px;

            color: #777;

            font-size: 10px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .card {
                padding: 35px 22px 29px;
                border-radius: 21px;
            }

            .logo h1 {
                font-size: 41px;
                letter-spacing: 6px;
            }

            .subtitle {
                font-size: 9px;
                letter-spacing: 2.5px;
            }
        }
    </style>
</head>

<body>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <main class="wrapper">

        <section class="card">

            <div class="logo">
                <h1>HAZEL</h1>
            </div>

            <div class="subtitle">
                Secure Access
            </div>

            <form id="loginForm">

                <!-- USERNAME -->

                <div class="field">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrap">

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrap">

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrap">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    Unlock HAZEL
                </button>

                <div
                    class="status"
                    id="status"
                    aria-live="polite"
                ></div>

            </form>

            <div class="footer">
                Private Section • <span>HAZEL</span>
            </div>

        </section>

    </main>


    <!-- SUCCESS SCREEN -->

    <div
        class="success-screen"
        id="successScreen"
    >

        <div class="success-content">

            <div class="success-icon">
                ✓
            </div>

            <h2>
                Access Granted
            </h2>

            <p>
                Opening your private section...
            </p>

        </div>

    </div>


    <script>

        /* =========================
           LOGIN CREDENTIALS
        ========================= */

        const correctUsername = "imirhamza14";

        const correctEmail = "imirhamza14@gmail.com";

        const correctPassword =
            "els@@ndh@mz@_(180625)?!";


        /* =========================
           ELEMENTS
        ========================= */

        const loginForm =
            document.getElementById("loginForm");

        const username =
            document.getElementById("username");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const showPassword =
            document.getElementById("showPassword");

        const loginButton =
            document.getElementById("loginButton");

        const status =
            document.getElementById("status");

        const successScreen =
            document.getElementById("successScreen");


        /* =========================
           SHOW / HIDE PASSWORD
        ========================= */

        showPassword.addEventListener("click", () => {

            if (password.type === "password") {

                password.type = "text";

                showPassword.textContent = "Hide";

            } else {

                password.type = "password";

                showPassword.textContent = "Show";

            }

        });


        /* =========================
           LOGIN
        ========================= */

        loginForm.addEventListener("submit", (event) => {

            event.preventDefault();

            status.textContent = "";
            status.className = "status";

            loginButton.classList.add("loading");

            loginButton.textContent = "Verifying...";


            setTimeout(() => {

                const usernameMatch =
                    username.value.trim() === correctUsername;

                const emailMatch =
                    email.value.trim().toLowerCase() ===
                    correctEmail.toLowerCase();

                const passwordMatch =
                    password.value === correctPassword;


                /* =========================
                   SUCCESS
                ========================= */

                if (
                    usernameMatch &&
                    emailMatch &&
                    passwordMatch
                ) {

                    status.textContent =
                        "Authentication successful.";

                    status.classList.add("success");

                    successScreen.classList.add("show");


                    setTimeout(() => {

                        window.location.href =
                            "memologin3.html";

                    }, 1600);


                }

                /* =========================
                   ERROR
                ========================= */

                else {

                    status.textContent =
                        "Invalid login details. Please try again.";

                    status.classList.add("error");

                    loginButton.classList.remove("loading");

                    loginButton.textContent =
                        "Unlock HAZEL";

                }

            }, 850);

        });

    </script>

</body>
  </html>
