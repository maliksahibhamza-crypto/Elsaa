<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Videos Folder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .video-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            text-decoration: none;
            color: #222222;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            transition: 0.25s ease;
        }

        .video-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.10);
            border-color: #d5d5d5;
        }

        .icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            border-radius: 13px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #888888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <a
        class="video-box"
        href="https://drive.google.com/drive/folders/1ub6PgSvZzzXqe0ByLk6Fsh5D5ktTwD9p"
        target="_blank"
        rel="noopener noreferrer"
    >
        <div class="icon">▶</div>

        <div class="title">
            Videos Folder
        </div>

        <div class="subtitle">
            Open video collection
        </div>
    </a>

</body>
  </html>
