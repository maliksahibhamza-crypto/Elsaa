<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Goal Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff7fa;
            color: #292126;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
            padding: 25px 16px 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .date {
            font-size: 14px;
            color: #9b7c87;
        }

        .streak {
            display: inline-block;
            margin-top: 12px;
            background: white;
            padding: 9px 16px;
            border-radius: 30px;
            border: 1px solid #f0dce3;
            font-size: 13px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.05);
        }

        .streak strong {
            color: #c64d78;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 22px;
            border: 1px solid #f1e1e6;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            margin-bottom: 18px;
        }

        .card-title {
            font-size: 13px;
            color: #9b7c87;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .progress {
            font-size: 25px;
            font-weight: bold;
            color: #c64d78;
        }

        .points {
            margin-top: 8px;
            font-size: 14px;
            color: #806a72;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #f5e8ed;
            border-radius: 20px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #d66b91;
            border-radius: 20px;
        }

        .section-title {
            font-size: 18px;
            margin: 25px 2px 12px;
        }

        .empty {
            background: white;
            border: 1px dashed #dfc5cf;
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            color: #9b7c87;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Daily Goal Tracker</h1>

        <div class="date" id="todayDate"></div>

        <div class="streak">
            🔥 Current Streak:
            <strong>0 Days</strong>
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Today's Progress
        </div>

        <div class="progress">
            0%
        </div>

        <div class="points">
            0 / 0 Points
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

    </div>


    <div class="section-title">
        Today's Goals
    </div>


    <div class="empty">

        No goals added yet.

        <br><br>

        Your goals will appear here.

    </div>

</div>


<script>

    const today = new Date();

    document.getElementById("todayDate").textContent =
        today.toLocaleDateString("en-US", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });

</script>

</body>
</html>
